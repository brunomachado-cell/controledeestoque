<title>Controle de Estoque Sudoeste</title>
<meta name="description" content="Painel operacional de estoque — Caminito e Nazo, unidade Sudoeste.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --ground:#eceef0; --surface:#ffffff; --surface-2:#f6f7f8; --line:#dfe3e7; --line-strong:#c8ced4;
  --ink:#1a1e24; --muted:#5c646e; --faint:#8a929c;
  --accent:#31528c; --accent-ink:#26406e; --accent-soft:#e8edf6;
  --caminito:#a5502a; --nazo:#2f5d6b;
  --good:#1f8a4c; --good-bg:#e6f2ea; --good-ink:#136336;
  --warn:#b7791f; --warn-bg:#f7efdd; --warn-ink:#8a5b12;
  --crit:#c0392b; --crit-bg:#f8e7e4; --crit-ink:#8f271c;
  --none:#8a929c; --none-bg:#eef0f2;
  --shadow:0 1px 2px rgba(20,26,34,.06),0 2px 8px rgba(20,26,34,.05);
  --radius:10px;
}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]){
  --ground:#0f1216; --surface:#171b21; --surface-2:#1e242c; --line:#2a313a; --line-strong:#3a434e;
  --ink:#e9ecef; --muted:#a4adb7; --faint:#7d868f;
  --accent:#7fa0d8; --accent-ink:#9db6e4; --accent-soft:#1d2836;
  --caminito:#d98a5f; --nazo:#6fb0c2;
  --good:#4cc07e; --good-bg:#12291d; --good-ink:#7fd7a3;
  --warn:#e0a83c; --warn-bg:#2c2413; --warn-ink:#f0c874;
  --crit:#e8695c; --crit-bg:#2e1815; --crit-ink:#f4a79d;
  --none:#7d868f; --none-bg:#1e242c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.25);
}
}
:root[data-theme="dark"]{
  --ground:#0f1216; --surface:#171b21; --surface-2:#1e242c; --line:#2a313a; --line-strong:#3a434e;
  --ink:#e9ecef; --muted:#a4adb7; --faint:#7d868f;
  --accent:#7fa0d8; --accent-ink:#9db6e4; --accent-soft:#1d2836;
  --caminito:#d98a5f; --nazo:#6fb0c2;
  --good:#4cc07e; --good-bg:#12291d; --good-ink:#7fd7a3;
  --warn:#e0a83c; --warn-bg:#2c2413; --warn-ink:#f0c874;
  --crit:#e8695c; --crit-bg:#2e1815; --crit-ink:#f4a79d;
  --none:#7d868f; --none-bg:#1e242c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Archivo",system-ui,sans-serif;margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;color:var(--ink)}
.wrap{max-width:1200px;margin:0 auto;padding:20px 20px 80px}

/* Header */
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line)}
.brandline{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.chip{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:100px;border:1px solid var(--line-strong)}
.chip.cam{color:var(--caminito);border-color:color-mix(in srgb,var(--caminito) 40%,var(--line))}
.chip.naz{color:var(--nazo);border-color:color-mix(in srgb,var(--nazo) 40%,var(--line))}
h1{font-size:26px;font-weight:800}
.sub{color:var(--muted);font-size:13.5px;margin-top:3px}
.headright{display:flex;align-items:center;gap:8px}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--none)}
.status-dot.on{background:var(--good)}
.status-dot.off{background:var(--crit)}
.conn{font-size:12px;color:var(--muted)}
.iconbtn{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:7px 9px;color:var(--ink);font-size:13px;display:inline-flex;align-items:center;gap:6px}
.iconbtn:hover{background:var(--surface-2)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;box-shadow:var(--shadow)}
.kpi .lab{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.kpi .val{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:30px;font-weight:600;margin-top:4px;line-height:1}
.kpi .foot{font-size:12px;color:var(--faint);margin-top:6px}
.kpi.crit{border-left:3px solid var(--crit)}
.kpi.warn{border-left:3px solid var(--warn)}
.kpi.good{border-left:3px solid var(--good)}
.kpi.acc{border-left:3px solid var(--accent)}
.kpi .val.c-crit{color:var(--crit)} .kpi .val.c-warn{color:var(--warn)} .kpi .val.c-good{color:var(--good)} .kpi .val.c-acc{color:var(--accent)}

/* Section */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px}
.card h2{font-size:15px;font-weight:700;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.card h2 .hint{font-family:"IBM Plex Sans";font-weight:400;font-size:12px;color:var(--faint)}
.card .body{padding:14px 16px}

/* Sector bars */
.sectorgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 26px}
@media(max-width:720px){.sectorgrid{grid-template-columns:1fr}}
.sbar{display:grid;grid-template-columns:110px 1fr auto;align-items:center;gap:10px}
.sbar .nm{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:18px;border-radius:5px;background:var(--none-bg);overflow:hidden;display:flex}
.track i{display:block;height:100%;border-right:2px solid var(--surface)}
.track i:last-child{border-right:0}
.seg-good{background:var(--good)} .seg-warn{background:var(--warn)} .seg-crit{background:var(--crit)} .seg-none{background:var(--none)}
.sbar .cnt{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);white-space:nowrap}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:2px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.swatch{width:11px;height:11px;border-radius:3px;display:inline-block}

/* Toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tabs{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px}
.tabs button{border:0;background:transparent;color:var(--muted);padding:6px 13px;border-radius:6px;font-size:13px;font-weight:600}
.tabs button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.field{position:relative}
input.search,select.sel{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:8px 11px;font-size:13px;min-width:0}
input.search{width:230px}
.spacer{flex:1}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 13px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:var(--accent-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong)}
.btn.ghost:hover{background:var(--surface-2)}

/* Sector filter chips */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.fchip{background:var(--surface);border:1px solid var(--line-strong);color:var(--muted);border-radius:100px;padding:5px 12px;font-size:12.5px;font-weight:600}
.fchip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.fchip .n{font-family:"IBM Plex Mono",monospace;opacity:.7;margin-left:5px}

/* Table */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
thead th.num,td.num{text-align:right}
tbody td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:var(--surface-2)}
.itnm{font-weight:600;color:var(--ink)}
.itsub{font-size:11.5px;color:var(--faint);margin-top:1px}
.stripe{border-left:4px solid transparent;padding-left:10px}
.stripe.s-good{border-color:var(--good)} .stripe.s-warn{border-color:var(--warn)} .stripe.s-crit{border-color:var(--crit)} .stripe.s-none{border-color:var(--none)}
.pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:100px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.pill.p-good{background:var(--good-bg);color:var(--good-ink)} .pill.p-warn{background:var(--warn-bg);color:var(--warn-ink)} .pill.p-crit{background:var(--crit-bg);color:var(--crit-ink)} .pill.p-none{background:var(--none-bg);color:var(--muted)}
.pi{font-size:10px}
.setortag{font-size:11px;color:var(--muted)}
.um{font-size:11px;color:var(--faint);margin-left:3px}
input.qty{width:78px;background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:6px 8px;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;text-align:right;font-size:13px}
input.qty:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
input.qty.mn{color:var(--muted)}
td .sug{font-family:"IBM Plex Mono",monospace;font-weight:600}
td .sug.zero{color:var(--faint);font-weight:400}
td .sug.need{color:var(--crit)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.count-badge{font-size:12px;color:var(--muted)}

/* buy list */
.buygrp{margin-bottom:16px}
.buygrp h3{font-size:13px;font-weight:700;color:var(--accent-ink);margin-bottom:6px;letter-spacing:0}
.buyrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line);align-items:center}
.buyrow .q{font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--crit)}

/* banner */
.banner{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));color:var(--accent-ink);border-radius:9px;padding:10px 14px;font-size:13px;margin-bottom:16px;display:flex;gap:10px;align-items:center}
.banner.sample{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 30%,var(--line));color:var(--warn-ink)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,14,20,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal{background:var(--surface);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-width:460px;width:100%;padding:20px}
.modal h3{font-size:17px;margin-bottom:14px}
.frow{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.frow label{font-size:12px;color:var(--muted);font-weight:600}
.frow input,.frow select{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:9px 11px;font-size:14px}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.hidefile{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 18px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);z-index:80;opacity:0;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
/* entradas / conferência de nota */
.notahead{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px;padding:12px 16px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.nf{display:flex;flex-direction:column;gap:1px}
.nf .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:600}
.nf .v{font-size:13px;font-weight:600}
.nf .v.mono{font-family:"IBM Plex Mono",monospace}
.confrow td{vertical-align:top}
.confrow .notaside{font-size:12px;color:var(--muted)}
.confrow .notaside b{color:var(--ink);font-weight:600;font-size:13px;display:block}
select.destsel{background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:6px 8px;font-size:12.5px;max-width:290px;width:100%}
input.fator{width:88px;background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:6px 8px;font-family:"IBM Plex Mono",monospace;text-align:right;font-size:12.5px}
input.fator.falta{border-color:var(--warn);background:var(--warn-bg)}
.lnstat{font-size:11px;font-weight:600;padding:2px 8px;border-radius:100px;white-space:nowrap}
.ls-ok{background:var(--good-bg);color:var(--good-ink)}
.ls-fator{background:var(--warn-bg);color:var(--warn-ink)}
.ls-item{background:var(--crit-bg);color:var(--crit-ink)}
.ls-skip{background:var(--none-bg);color:var(--muted)}
.confbar{display:flex;gap:10px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.confbar .sum{font-size:13px;color:var(--muted)}
.confbar .sum b{color:var(--ink)}
.drop{border:2px dashed var(--line-strong);border-radius:10px;padding:32px 20px;text-align:center;color:var(--muted);background:var(--surface-2)}
.drop b{color:var(--ink);display:block;font-size:15px;margin-bottom:4px}
.drop .hintsm{font-size:12px;color:var(--faint);margin-top:8px;line-height:1.6}
.prog{font-size:13px;color:var(--accent-ink);display:flex;align-items:center;gap:8px}
.spin{width:13px;height:13px;border:2px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.entrow{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center;font-size:13px}
.entrow .mono{font-family:"IBM Plex Mono",monospace}
.warnbox{background:var(--crit-bg);border:1px solid color-mix(in srgb,var(--crit) 35%,var(--line));color:var(--crit-ink);border-radius:8px;padding:10px 13px;font-size:12.5px;margin:12px 16px}
@media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}.headright{width:100%;justify-content:flex-start}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="brandline">
        <span class="chip cam">Caminito</span>
        <span class="chip naz">Nazo</span>
        <span class="setortag mono">· Sudoeste</span>
      </div>
      <h1>Controle de Estoque</h1>
      <div class="sub" id="subline">Posição operacional do estoque por setor — semáforo, mínimos e sugestão de compra.</div>
    </div>
    <div class="headright">
      <span class="conn"><span class="status-dot" id="connDot"></span> <span id="connTxt">conectando…</span></span>
      <button class="iconbtn" id="themeBtn" title="Alternar tema">◐</button>
    </div>
  </header>

  <div id="banner"></div>

  <div class="kpis" id="kpis"></div>

  <div class="card">
    <h2>Composição por setor <span class="hint">verde = ok · âmbar = atenção · vermelho = abaixo do mínimo</span></h2>
    <div class="body">
      <div class="sectorgrid" id="sectorbars"></div>
      <div class="legend">
        <span><i class="swatch seg-good"></i> No mínimo ou acima</span>
        <span><i class="swatch seg-warn"></i> Atenção (perto do mínimo)</span>
        <span><i class="swatch seg-crit"></i> Abaixo do mínimo</span>
        <span><i class="swatch seg-none"></i> Sem contagem</span>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <div class="tabs" id="tabs">
      <button data-tab="estoque" class="active">Estoque</button>
      <button data-tab="compra">Lista de compra</button>
      <button data-tab="entradas">Entradas (notas)</button>
      <button data-tab="cmv">CMV</button>
    </div>
    <div class="spacer"></div>
    <input class="search" id="search" type="search" placeholder="Buscar item…" autocomplete="off">
    <select class="sel" id="statusFilter" title="Filtrar por status">
      <option value="todos">Todos os status</option>
      <option value="crit">Abaixo do mínimo</option>
      <option value="warn">Atenção</option>
      <option value="good">No mínimo/acima</option>
      <option value="none">Sem contagem</option>
    </select>
    <button class="btn ghost" id="uploadBtn" title="Subir planilha de contagem preenchida">⇪ Contagem</button>
    <button class="btn ghost" id="salvarCont" title="Salvar a contagem atual no histórico (base do CMV)">⛁ Salvar contagem</button>
    <button class="btn ghost" id="addBtn">＋ Item</button>
    <input class="hidefile" id="fileInput" type="file" accept=".xlsx,.xls,.csv">
  </div>

  <div class="chips" id="sectorchips"></div>

  <div id="view"></div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const SETORES = ["BAR","CARNES","COZINHA","DELIVERY","HORTIFRUTI","LIMPEZA","PARRILLA","SECOS","SUSHI","VINHOS"];
// Amostra usada só quando a base ainda não conectou (marcada como exemplo).
const SAMPLE = [
 {id:"dest_gin_beefeater",nome_everest:"DEST GIN BEEFEATER",nome_checklist:"DEST GIN BEEFEATER (LITRO)",setor:"BAR",subsetor:"BEBIDAS",unidade:"LITRO",minimo:0.75,contagem:0.4},
 {id:"po_ancho_250g",nome_everest:"PO ANCHO 250G",nome_checklist:"PO ANCHO 250G (UNID)",setor:"CARNES",subsetor:"CONGELADA",unidade:"UNID",minimo:100,contagem:120},
 {id:"po_salmao_200g",nome_everest:"PO SALMAO 200G",nome_checklist:"PO SALMAO 200G (UNID)",setor:"CARNES",subsetor:"CONGELADA",unidade:"UNID",minimo:54,contagem:50},
 {id:"hort_abacaxi",nome_everest:"HORT ABACAXI",nome_checklist:"HORT ABACAXI (UNID)",setor:"HORTIFRUTI",subsetor:"HORTIFRUTI",unidade:"UNID",minimo:41,contagem:12},
 {id:"mp_camarao_51_60",nome_everest:"MP CAMARAO S/ CASCA 51/60",nome_checklist:"MP CAMARAO S/ CASCA 51/60 (KG)",setor:"COZINHA",subsetor:"CONGELADA",unidade:"KG",minimo:12,contagem:12},
 {id:"hort_cenoura_kg",nome_everest:"HORT CENOURA KG",nome_checklist:"HORT CENOURA KG (KG)",setor:"HORTIFRUTI",subsetor:"HORTIFRUTI",unidade:"KG",minimo:27,contagem:31},
];

const state = {
  itens: {},            // id -> item {..., minimo, contagem}
  amareloFator: 1.15,   // banda de atenção acima do mínimo
  filtroSetor: "todos",
  filtroStatus: "todos",
  busca: "",
  tab: "estoque",
  isSample: false,
  dePara: {},      // cnpjDigits -> {cnpj, fornecedor, itens:{chave:{item_id,fator,...}}}
  entradas: [],    // notas já conferidas e gravadas
  draft: null,     // nota em conferência
  aiStatus: null,  // texto de progresso da leitura
  aiImg: null,     // true/false: este visualizador aceita enviar imagem para a IA
  contagens: [],   // snapshots de contagem (histórico) -> base do CMV
  cmvA: null, cmvB: null,
};
const CNPJ_UNIDADE = "35631524000327";   // MULT COMERCIO (SIG = Sudoeste)
let db = null, catalogoCol = null, cfgDoc = null;
let persistTimer = null; const dirtySetores = new Set();

/* ---------- status ---------- */
function statusOf(it){
  const c = it.contagem;
  if(c===null||c===undefined||c==="") return "none";
  const m = Number(it.minimo)||0;
  const n = Number(c);
  if(n < m) return "crit";
  if(n < m*state.amareloFator) return "warn";
  return "good";
}
function sugestao(it){
  const c = it.contagem;
  if(c===null||c===undefined||c==="") return null;
  const m = Number(it.minimo)||0;
  const d = m - Number(c);
  return d>0 ? Math.ceil(d*100)/100 : 0;
}
const fmt = n => (n===null||n===undefined||n==="")?"—":(Math.round(Number(n)*100)/100).toLocaleString("pt-BR");

/* ---------- rendering ---------- */
function itemsArray(){ return Object.values(state.itens); }

function renderKPIs(){
  const arr = itemsArray();
  const counts = {crit:0,warn:0,good:0,none:0};
  let aPedir=0;

/* ---------- xlsx contagem upload ---------- */
function normalize(s){return (s||"").toString().trim().toUpperCase().replace(/\s+/g," ");}
function handleFile(file){
  const rd=new FileReader();
  rd.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:"array"});
      const ws=wb.Sheets[wb.SheetNames.includes("contagem")?"contagem":wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:""});
      const byEver={},byChk={};
      itemsArray().forEach(it=>{byEver[normalize(it.nome_everest)]=it; byChk[normalize(it.nome_checklist)]=it;});
      let matched=0,updated=0,missing=[]; const touched=new Set();
      rows.forEach(r=>{
        const ever=normalize(r["DESCRIÇÃO ITEM EVEREST"]||r["DESCRICAO ITEM EVEREST"]);
        const chk=normalize(r["ITEM CHECKLIST"]);
        const it=byEver[ever]||byChk[chk];
        const cont=r["CONTAGEM"];
        if(!it){ if(ever||chk) missing.push(ever||chk); return; }
        matched++;
        if(cont!==""&&cont!==null&&cont!==undefined&&!isNaN(Number(cont))){ setField(it.id,"contagem",Number(cont)); touched.add(it.setor); updated++; }
      });
      renderAll();
      touched.forEach(writeSetor);
      toast(`Contagem lida: ${updated} atualizados, ${matched} reconhecidos${missing.length?`, ${missing.length} não encontrados`:""}.`);
    }catch(err){ toast("Falha ao ler a planilha: "+err.message); }
  };
  rd.readAsArrayBuffer(file);
}

}

/* ================= ENTRADAS (notas) ================= */
const dig = s => (s||"").toString().replace(/\D/g,"");
function umNorm(u){ u=(u||"").toString().trim().toUpperCase();
  if(["UN","UNID","UNIDADE","UND","PC","PÇ"].includes(u)) return "UNID";
  if(["L","LT","LITRO","LITROS"].includes(u)) return "LITRO";
  if(["KG","QUILO","KGS"].includes(u)) return "KG";
  return u; }
function descKey(s){ return "desc:"+(s||"").normalize("NFKD").replace(/[\u0300-\u036f]/g,"")
  .toUpperCase().replace(/[^A-Z0-9 ]/g," ").replace(/\s+/g," ").trim(); }

function lookupDePara(cnpj,codigo,descricao){
  const d=state.dePara[dig(cnpj)]; if(!d||!d.itens) return null;
  if(codigo && d.itens[codigo]) return {...d.itens[codigo],chave:codigo};
  const dk=descKey(descricao);
  if(d.itens[dk]) return {...d.itens[dk],chave:dk};
  return null;
}
async function saveDePara(cnpj,fornecedor,chave,entry){
  const id=dig(cnpj); if(!id) return;
  const doc=state.dePara[id]||{cnpj,fornecedor,itens:{}};
  doc.itens[chave]={...entry,validado_bruno:true,aprovado_em:new Date().toISOString()};
  doc.cnpj=cnpj; doc.fornecedor=doc.fornecedor||fornecedor;
  state.dePara[id]=doc;
  if(db){ try{ await db.collection("de_para").doc(id).set(doc); }catch(e){ toast("De-para não salvo: "+(e.code||e.message)); } }
}

/* --- PDF -> imagens --- */
async function pdfParaImagens(file,maxPag){
  if(!window.pdfjsLib) throw new Error("biblioteca de PDF não carregou");
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const n=Math.min(pdf.numPages,maxPag||4), blobs=[];
  for(let i=1;i<=n;i++){
    const pg=await pdf.getPage(i);
    const vp=pg.getViewport({scale:2.0});
    const cv=document.createElement("canvas"); cv.width=vp.width; cv.height=vp.height;
    await pg.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
    const b=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.88));
    if(b) blobs.push(b);
  }
  return {blobs,total:pdf.numPages,lidas:n};
}

const PROMPT_NOTA = `Você está lendo as imagens de uma NOTA FISCAL ELETRÔNICA brasileira (DANFE), digitalizada.
Extraia os dados EXATAMENTE como estão impressos. Não invente, não complete, não arredonde.

Foque na tabela "DADOS DOS PRODUTOS / SERVIÇOS". Ela tem as colunas:
CÓD. PROD. | DESCRIÇÃO DO PRODUTO/SERVIÇO | NCM/SH | CST | CFOP | UN | QTD | V.UNIT | V.TOTAL
Inclua TODAS as linhas de produto de TODAS as páginas enviadas (a nota pode ter "Folha 1/2", "2/2" etc.).

Regras:
- Números em formato brasileiro (1.234,56) devem virar número decimal com ponto (1234.56).
- "un" é a unidade impressa na coluna UN (KG, UN, LT...). Mantenha como está.
- Se um campo estiver ilegível, use null. NUNCA adivinhe um número.
- Não inclua linhas que não sejam produto (totais, impostos, observações).

Responda APENAS com um objeto JSON nesta forma:
{"fornecedor":{"nome":string|null,"cnpj":string|null},
 "nota":{"numero":string|null,"serie":string|null,"emissao":string|null,"chave":string|null,
         "valor_total_produtos":number|null},
 "destinatario":{"nome":string|null,"cnpj":string|null},
 "itens":[{"codigo":string|null,"descricao":string,"un":string|null,"qtd":number|null,"vunit":number|null,"vtotal":number|null}],
 "ilegivel":[string]}
O campo "valor_total_produtos" e o "VALOR TOTAL DOS PRODUTOS" impresso no quadro de imposto da nota.
Em "ilegivel" liste descrições de itens cujos números você não conseguiu ler com certeza.`;

async function lerNota(files){
  const sample = await (window.claude?.use?.("sample").catch(()=>null));
  if(!sample){ toast("Leitura por IA indisponível nesta visualização."); return; }
  let caps=null; try{ caps=await sample.limits(); }catch(e){}
  if(!caps || !caps.images){ toast("Esta visualização não aceita envio de imagens."); return; }
  const maxImgs=caps.images.maxCount||4;

  state.aiStatus="Preparando as páginas da nota…"; renderAll();
  let blobs=[],aviso="";
  try{
    for(const f of files){
      if(/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name)){
        const r=await pdfParaImagens(f,maxImgs-blobs.length);
        blobs=blobs.concat(r.blobs);
        if(r.total>r.lidas) aviso=`A nota tem ${r.total} páginas; li as ${r.lidas} primeiras (limite de ${maxImgs} imagens por leitura).`;
      } else if(/^image\//.test(f.type)) blobs.push(f);
      if(blobs.length>=maxImgs) break;
    }
  }catch(e){ state.aiStatus=null; renderAll(); toast("Não consegui abrir o PDF: "+e.message+". Tente subir fotos das páginas."); return; }
  if(!blobs.length){ state.aiStatus=null; renderAll(); toast("Nenhuma página para ler."); return; }

  state.aiStatus="Lendo a nota com IA… (pode levar até 1 minuto)"; renderAll();
  let data=null;
  try{
    data=await sample.json(PROMPT_NOTA,{images:blobs,modelTier:"complex"});
  }catch(e){
    state.aiStatus=null; renderAll();
    const m={not_granted:"Você recusou o uso da IA nesta visualização.",rate_limited:"Muitas leituras seguidas — aguarde um instante.",
      invalid_json:"A IA não devolveu dados estruturados. Tente uma foto mais nítida.",images_unavailable:"Envio de imagens indisponível.",
      image_rejected:"Alguma página foi rejeitada (formato ou tamanho).",prompt_too_large:"Nota muito grande para uma leitura."};
    toast(m[e.code]||("Falha na leitura: "+(e.code||e.message))); return;
  }
  state.aiStatus=null;
  montarConferencia(data,aviso);
}

function montarConferencia(data,aviso){
  const forn=data?.fornecedor||{}, nota=data?.nota||{}, dest=data?.destinatario||{};
  const linhas=(data?.itens||[]).map((it,i)=>{
    const dp=lookupDePara(forn.cnpj,it.codigo,it.descricao);
    const item=dp? state.itens[dp.item_id]:null;
    const unN=umNorm(it.un), umC=item?umNorm(item.unidade):null;
    let fator = dp? dp.fator : null;
    if(fator==null && umC && unN===umC) fator=1;
    return {idx:i,codigo:it.codigo||"",descricao:it.descricao||"",un:it.un||"",qtd:it.qtd,
      vunit:it.vunit,vtotal:it.vtotal,item_id:item?item.id:null,fator,ignorar:false,
      novo_mapa:!dp};
  });
  state.draft={forn,nota,dest,linhas,aviso,ilegivel:data?.ilegivel||[]};
  if(state.draft.nota) state.draft.nota.valor_total_produtos=data?.nota?.valor_total_produtos??null;
  state.tab="entradas"; renderAll();
}

function calcLinha(l){
  const item=l.item_id?state.itens[l.item_id]:null;
  if(l.ignorar) return {status:"skip",qtd:null,item};
  if(!item) return {status:"item",qtd:null,item};
  if(l.qtd==null) return {status:"qtd",qtd:null,item};
  const f=Number(l.fator);
  if(!f||f<=0) return {status:"fator",qtd:null,item};
  return {status:"ok",qtd:Number(l.qtd)/f,item};
}
const LST={ok:["ls-ok","conferido"],fator:["ls-fator","informe o fator"],qtd:["ls-fator","informe a quantidade"],
  item:["ls-item","escolha o item"],skip:["ls-skip","ignorada"]};

function renderConferencia(){
  itensDatalist();
  const d=state.draft, view=document.getElementById("view");
  const destOk = dig(d.dest?.cnpj)===CNPJ_UNIDADE;
  const calc=d.linhas.map(calcLinha);

  const nPend=calc.filter(c=>c.status==="fator"||c.status==="item"||c.status==="qtd").length;
  const totalNota=d.linhas.reduce((s,l)=>s+(Number(l.vtotal)||0),0);
  const totalImpresso=d.nota?.valor_total_produtos!=null?Number(d.nota.valor_total_produtos):null;
  const difTotal=totalImpresso!=null?Math.abs(totalNota-totalImpresso):null;
  const totalBate=difTotal!=null?difTotal<=0.05:null;
  const linhasTortas=d.linhas.filter(l=>l.qtd!=null&&l.vunit!=null&&l.vtotal!=null

  view.innerHTML=`<div class="card">

      <div class="nf"><span class="k">Emissão</span><input class="destsel" id="mh_emi" value="${d.nota?.emissao||""}" placeholder="dd/mm/aaaa"></div>
      `:`
      <div class="nf"><span class="k">Fornecedor</span><span class="v">${d.forn?.nome||"—"}</span></div>
      <div class="nf"><span class="k">CNPJ fornecedor</span><span class="v mono">${d.forn?.cnpj||"—"}</span></div>
      <div class="nf"><span class="k">Nota</span><span class="v mono">${d.nota?.numero||"—"}${d.nota?.serie?" / "+d.nota.serie:""}</span></div>
      <div class="nf"><span class="k">Emissão</span><span class="v mono">${d.nota?.emissao||"—"}</span></div>
      <div class="nf"><span class="k">Total dos produtos</span><span class="v mono">R$ ${totalNota.toLocaleString("pt-BR",{minimumFractionDigits:2})}</span></div>
      <div class="nf"><span class="k">Destinatário</span><span class="v">${d.dest?.nome||"—"}</span></div>`}
    </div>
    ${(!d.manual && !destOk)?`<div class="warnbox"><b>Atenção:</b> o destinatário lido (CNPJ ${d.dest?.cnpj||"não identificado"}) não é o CNPJ da sua unidade (35.631.524/0003-27). Confirme se esta nota é desta loja antes de dar entrada.</div>`:""}
    ${(!d.manual && totalBate===true)?`<div class="banner" style="margin:12px 16px">
        <b>✓ Leitura auditada.</b> A soma das linhas (R$ ${totalNota.toLocaleString("pt-BR",{minimumFractionDigits:2})})
        confere com o total impresso na nota${linhasTortas.length?"":", e em todas as linhas qtd × valor unitário = valor total"}.
      </div>`:""}
    ${(!d.manual && totalBate===false)?`<div class="warnbox">
        <b>Atenção — a leitura não fecha.</b> A soma das linhas dá
        R$ ${totalNota.toLocaleString("pt-BR",{minimumFractionDigits:2})}, mas a nota diz
        R$ ${totalImpresso.toLocaleString("pt-BR",{minimumFractionDigits:2})}
        (diferença de R$ ${difTotal.toLocaleString("pt-BR",{minimumFractionDigits:2})}).
        Algum número foi lido errado ou uma linha ficou de fora. Confira no papel antes de dar entrada.
      </div>`:""}
    ${(!d.manual && totalImpresso===null)?`<div class="banner" style="margin:12px 16px">

      </div>`:""}
    ${linhasTortas.length?`<div class="warnbox"><b>${linhasTortas.length} linha(s) onde qtd × valor unitário não dá o valor total:</b>

    ${d.aviso?`<div class="warnbox">${d.aviso}</div>`:""}
    ${d.ilegivel?.length?`<div class="warnbox"><b>A IA marcou como duvidoso:</b> ${d.ilegivel.join(" · ")}. Confira esses números no papel.</div>`:""}
    <div class="tablewrap"><table>
      <thead><tr><th>Item na nota</th><th class="num">Qtd</th><th>Destino no estoque</th><th class="num">Fator</th><th class="num">Entra</th><th>Status</th><th>Ignorar</th></tr></thead>
      <tbody>${d.linhas.map((l,i)=>{
        const c=calc[i]; const [cls,txt]=LST[c.status];

          <td class="num">${l.manual
            ? `<input class="fator" data-f="qtd" type="number" step="any" value="${l.qtd??""}" placeholder="qtd">`

          <td><input class="destsel" list="itensDL" data-f="item" value="${item?item.nome_everest:""}" placeholder="digite para buscar…"></td>

              <div class="setortag" style="font-size:10px">${item?`${umNorm(l.un)||"?"}/${umNorm(item.unidade)}`:""}</div></td>
          <td class="num mono">${c.qtd!=null?fmt(c.qtd)+" "+(item?item.unidade:""):"—"}</td>
          <td><span class="lnstat ${cls}">${txt}</span></td>

        </tr>`;}).join("")}
      </tbody></table></div>
    <div class="confbar">
      ${d.manual?`<button class="btn ghost" id="addlinha">＋ Linha</button>`:""}
      <span class="sum"><b>${nOk}</b> conferidos · <b>${nPend}</b> pendentes · <b>${calc.filter(c=>c.status==="skip").length}</b> ignorados</span>
      <div class="spacer"></div>
      <button class="btn" id="confirmar" ${(nPend||!nOk)?"disabled style=opacity:.5;cursor:not-allowed":""}>✓ Dar entrada no estoque</button>

  view.querySelectorAll("tr.confrow").forEach(tr=>{
    const i=+tr.dataset.i;
    tr.querySelector('[data-f="item"]').addEventListener("change",e=>{

      state.draft.linhas[i].fator=(v!=null&&v>0)?v:null; renderConferencia();
    });
    tr.querySelector('[data-f="ignorar"]').addEventListener("change",e=>{
      state.draft.linhas[i].ignorar=e.target.checked; renderConferencia();
    });
    const dsc=tr.querySelector('[data-f="descricao"]');
    if(dsc) dsc.addEventListener("change",e=>{ state.draft.linhas[i].descricao=e.target.value; });
    const qt=tr.querySelector('[data-f="qtd"]');
    if(qt) qt.addEventListener("change",e=>{
      const v=e.target.value===""?null:Number(e.target.value);
      state.draft.linhas[i].qtd=(v!=null&&v>=0)?v:null; renderConferencia();
    });

  if(d.manual){
    const bind=(id,fn)=>{const el=document.getElementById(id); if(el) el.addEventListener("change",e=>fn(e.target.value));};
    bind("mh_nome",v=>state.draft.forn.nome=v);
    bind("mh_cnpj",v=>state.draft.forn.cnpj=v);
    bind("mh_num", v=>state.draft.nota.numero=v);
    bind("mh_emi", v=>state.draft.nota.emissao=v);
    const al=document.getElementById("addlinha");
    if(al) al.onclick=()=>{ addLinhaManual(); renderConferencia(); };
  }
  document.getElementById("descartar").onclick=()=>{ state.draft=null; renderAll(); };
  const cb=document.getElementById("confirmar");
  if(cb && !nPend && nOk) cb.onclick=confirmarEntrada;
}

async function confirmarEntrada(){
  const d=state.draft; if(!d) return;
  const linhas=d.linhas.map(l=>{
    const c=calcLinha(l); const item=c.item;
    return {codigo:l.codigo,descricao:l.descricao,un:l.un,qtd:l.qtd,vunit:l.vunit,vtotal:l.vtotal,
      item_id:l.item_id,item_everest:item?item.nome_everest:null,um_catalogo:item?item.unidade:null,
      fator:l.fator,qtd_convertida:c.qtd,ignorar:l.ignorar};
  });
  const total=linhas.reduce((s,l)=>s+(Number(l.vtotal)||0),0);
  const id=(dig(d.forn?.cnpj)||"sem")+"_"+(dig(d.nota?.numero)||Date.now().toString(36));
  const doc={id,fornecedor:d.forn?.nome||null,cnpj:d.forn?.cnpj||null,numero:d.nota?.numero||null,
    serie:d.nota?.serie||null,emissao:d.nota?.emissao||null,chave:d.nota?.chave||null,
    destinatario_cnpj:d.dest?.cnpj||null,linhas,total,criado_em:new Date().toISOString()};

  // aprende o de-para (código do fornecedor -> item + fator)
  for(const l of d.linhas){
    if(l.ignorar||!l.item_id||!l.fator) continue;
    const item=state.itens[l.item_id]; if(!item) continue;
    const chave=(l.codigo&&l.codigo!=="?")?l.codigo:descKey(l.descricao);
    await saveDePara(d.forn?.cnpj,d.forn?.nome,chave,{item_id:l.item_id,item_everest:item.nome_everest,
      descricao_nota:l.descricao,un_nota:l.un,um_catalogo:item.unidade,fator:Number(l.fator)});
  }
  state.entradas.push(doc);
  if(db){ try{ await db.collection("entradas").doc(id).set(doc); toast("Entrada gravada e de-para aprendido."); }
    catch(e){ toast("Erro ao gravar entrada: "+(e.code||e.message)); } }
  else toast("Entrada registrada só nesta sessão (base não conectada).");
  state.draft=null; renderAll();
}

/* ================= CONTAGENS (histórico) + CMV ================= */
function hojeISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function brDate(s){ // "dd/mm/aaaa" -> "aaaa-mm-dd"; devolve null se não der
  if(!s) return null;
  const m=String(s).match(/(\d{2})\/(\d{2})\/(\d{4})/);
  if(m) return `${m[3]}-${m[2]}-${m[1]}`;
  const i=String(s).match(/^\d{4}-\d{2}-\d{2}/); return i?i[0]:null;
}
function dataNota(n){ return brDate(n.emissao) || (n.criado_em||"").slice(0,10) || null; }

async function salvarContagem(rotulo){
  const valores={};
  itemsArray().forEach(it=>{ if(it.contagem!=null&&it.contagem!=="") valores[it.id]=Number(it.contagem); });
  const n=Object.keys(valores).length;
  if(!n){ toast("Nenhuma contagem preenchida para salvar."); return; }
  const id=hojeISO()+"_"+Math.random().toString(36).slice(2,6);
  const doc={id,data:hojeISO(),rotulo:rotulo||("Contagem "+hojeISO()),valores,
    itens_contados:n,criado_em:new Date().toISOString()};
  state.contagens.push(doc);
  if(db){ try{ await db.collection("contagens").doc(id).set(doc); toast(`Contagem salva: ${n} itens.`); }
    catch(e){ toast("Erro ao salvar contagem: "+(e.code||e.message)); } }
  else toast(`Contagem salva só nesta sessão (${n} itens).`);
  renderAll();
}

/* custo por unidade do catálogo, da última entrada de cada item */
function custoUltimo(){
  const out={};
  const ord=state.entradas.slice().sort((a,b)=>String(dataNota(a)||"").localeCompare(String(dataNota(b)||"")));
  ord.forEach(n=>(n.linhas||[]).forEach(l=>{
    if(l.ignorar||!l.item_id||l.vunit==null||!l.fator) return;
    // vunit é por unidade da NOTA; fator = un_nota por 1 um_catalogo
    out[l.item_id]={custo:Number(l.vunit)*Number(l.fator),data:dataNota(n),fornecedor:n.fornecedor};
  }));
  return out;
}
function comprasEntre(dIni,dFim){
  const acc={};
  state.entradas.forEach(n=>{
    const d=dataNota(n); if(!d) return;
    if(dIni && d<=dIni) return;
    if(dFim && d>dFim) return;
    (n.linhas||[]).forEach(l=>{ if(l.ignorar||!l.item_id) return;
      acc[l.item_id]=(acc[l.item_id]||0)+(Number(l.qtd_convertida)||0); });
  });
  return acc;
}

function renderCMV(){
  const view=document.getElementById("view");
  const cs=state.contagens.slice().sort((a,b)=>String(a.criado_em).localeCompare(String(b.criado_em)));
  if(cs.length<2){
    view.innerHTML=`<div class="card"><h2>CMV por diferença <span class="hint">estoque inicial + compras − estoque final</span></h2>
      <div class="body">
        <div class="warnbox" style="margin:0">
          <b>Faltam contagens.</b> O CMV por diferença precisa de <b>duas</b> contagens salvas —
          uma de abertura e uma de fechamento do período. Você tem <b>${cs.length}</b>.<br><br>
          Como fazer: preencha a contagem na aba <b>Estoque</b> (digitando ou subindo a planilha do
          checklist), clique em <b>Salvar contagem</b>, e repita no próximo dia de contagem.
          Na segunda, esta tela liga sozinha.
        </div>
        ${cs.length?`<div style="margin-top:12px"><b style="font-size:13px">Contagens salvas</b>
          ${cs.map(c=>`<div class="entrow"><div><b>${c.rotulo}</b></div>
            <div class="mono setortag">${c.itens_contados} itens</div><div class="setortag">${c.data}</div></div>`).join("")}</div>`:""}
      </div></div>`;
    return;
  }
  const iA=state.cmvA??0, iB=state.cmvB??(cs.length-1);
  const A=cs[Math.min(iA,cs.length-1)], B=cs[Math.min(iB,cs.length-1)];
  const compras=comprasEntre(A.data,B.data);
  const custos=custoUltimo();
  const rows=[];
  itemsArray().forEach(it=>{
    const ei=A.valores?.[it.id], ef=B.valores?.[it.id];
    if(ei==null&&ef==null) return;
    const c=compras[it.id]||0;
    const consumo=(ei!=null&&ef!=null)?(Number(ei)+c-Number(ef)):null;
    const cst=custos[it.id]?custos[it.id].custo:null;
    rows.push({it,ei,ef,c,consumo,cst,valor:(consumo!=null&&cst!=null)?consumo*cst:null});
  });
  rows.sort((a,b)=>(b.valor??-1)-(a.valor??-1)||(b.consumo??-1)-(a.consumo??-1));
  const neg=rows.filter(r=>r.consumo!=null&&r.consumo<0);
  const semEF=rows.filter(r=>r.ef==null).length;
  const totalR=rows.reduce((s,r)=>s+(r.valor||0),0);
  const comCusto=rows.filter(r=>r.valor!=null).length;

  view.innerHTML=`<div class="card">
    <h2>CMV por diferença <span class="hint">${A.data} → ${B.data}</span></h2>
    <div class="notahead">
      <div class="nf"><span class="k">Contagem inicial</span>
        <select class="sel" id="cmvA">${cs.map((c,i)=>`<option value="${i}" ${i===iA?"selected":""}>${c.rotulo} (${c.data})</option>`).join("")}</select></div>
      <div class="nf"><span class="k">Contagem final</span>
        <select class="sel" id="cmvB">${cs.map((c,i)=>`<option value="${i}" ${i===iB?"selected":""}>${c.rotulo} (${c.data})</option>`).join("")}</select></div>
      <div class="nf"><span class="k">Itens no cálculo</span><span class="v mono">${rows.length}</span></div>
      <div class="nf"><span class="k">CMV valorizado</span><span class="v mono">R$ ${totalR.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}</span></div>
      <div class="nf"><span class="k">Itens com custo</span><span class="v mono">${comCusto} de ${rows.length}</span></div>
    </div>
    ${neg.length?`<div class="warnbox"><b>${neg.length} item(ns) com consumo negativo — impossível fisicamente.</b>
      Significa contagem errada ou entrada não lançada: ${neg.slice(0,6).map(r=>r.it.nome_everest).join(" · ")}${neg.length>6?" …":""}</div>`:""}
    ${comCusto<rows.length?`<div class="banner" style="margin:12px 16px">Custo vem do <b>V.UNIT da última entrada</b> de cada item. ${rows.length-comCusto} item(ns) ainda sem entrada lançada ficam sem valor em R$.</div>`:""}
    <div class="tablewrap"><table>
      <thead><tr><th>Item</th><th>Setor</th><th class="num">Est. inicial</th><th class="num">Compras</th>
        <th class="num">Est. final</th><th class="num">Consumo</th><th class="num">Custo un.</th><th class="num">CMV R$</th></tr></thead>
      <tbody>${rows.map(r=>`<tr>
        <td class="stripe ${r.consumo!=null&&r.consumo<0?"s-crit":"s-none"}"><div class="itnm">${r.it.nome_everest}</div>
          <div class="itsub">${r.it.unidade}</div></td>
        <td><span class="setortag">${r.it.setor}</span></td>
        <td class="num mono">${r.ei??"—"}</td>
        <td class="num mono">${r.c?"+"+fmt(r.c):"—"}</td>
        <td class="num mono">${r.ef??"—"}</td>
        <td class="num mono" style="${r.consumo!=null&&r.consumo<0?"color:var(--crit);font-weight:600":""}">${r.consumo!=null?fmt(r.consumo):"—"}</td>
        <td class="num mono setortag">${r.cst!=null?"R$ "+r.cst.toFixed(2):"—"}</td>
        <td class="num mono" style="font-weight:600">${r.valor!=null?"R$ "+r.valor.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}):"—"}</td>
      </tr>`).join("")}</tbody></table></div>
    ${semEF?`<div class="confbar"><span class="sum">${semEF} item(ns) sem contagem final — ficam sem consumo calculado.</span></div>`:""}
  </div>`;
  document.getElementById("cmvA").onchange=e=>{state.cmvA=+e.target.value;renderCMV();};
  document.getElementById("cmvB").onchange=e=>{state.cmvB=+e.target.value;renderCMV();};
}

/* ---------- boot ---------- */
function loadSample(){
  state.isSample=true;
  SAMPLE.forEach(it=>state.itens[it.id]={...it,ativo:true});
  banner("<b>Dados de exemplo.</b> A base ainda não conectou — os 471 itens reais aparecem assim que o app se liga ao armazenamento. Nada digitado aqui é salvo.","sample");
  renderAll();
}

async function boot(){
  renderAll();
  let claudeApi=null;
  try{ claudeApi=window.claude; }catch(e){}
  if(!claudeApi||!claudeApi.use){ setConn(false,"offline"); loadSample(); return; }
  let d=null;
  try{ d=await claudeApi.use("db"); }catch(e){ d=null; }
  if(!d){ setConn(false,"sem base"); loadSample(); return; }
  db=d; catalogoCol=db.collection("catalogo"); cfgDoc=db.doc("config/app");
  setConn(true,"salvando na nuvem");
  // a IA aceita imagem neste visualizador? (define se a leitura de nota por PDF roda)
  (async()=>{
    try{
      const sp=await claudeApi.use("sample");
      if(!sp){ state.aiImg=false; }
      else { const c=await sp.limits(); state.aiImg=!!(c&&c.images); }
    }catch(e){ state.aiImg=false; }
    if(state.tab==="entradas") renderAll();
  })();
  // config
  try{ cfgDoc.onSnapshot(s=>{ const c=s.data(); if(c&&c.amareloFator){ state.amareloFator=Number(c.amareloFator); renderAll(); } }); }catch(e){}
  // de-para de fornecedores (1 doc por CNPJ)
  try{ db.collection("de_para").onSnapshot(snap=>{
      snap.docChanges().forEach(ch=>{
        if(ch.type==="removed") delete state.dePara[ch.doc.id];
        else state.dePara[ch.doc.id]=ch.doc.data()||{};
      });
      if(state.tab==="entradas") renderAll();
    }); }catch(e){}
  // histórico de contagens (base do CMV)
  try{ db.collection("contagens").onSnapshot(snap=>{
      state.contagens=snap.docs.map(x=>({...(x.data()||{}),id:x.id}));
      if(state.tab==="cmv") renderAll();
    }); }catch(e){}
  // notas de entrada já conferidas
  try{ db.collection("entradas").onSnapshot(snap=>{
      state.entradas=snap.docs.map(x=>({...(x.data()||{}),id:x.id}));
      renderAll();
    }); }catch(e){}
  // catálogo: 1 documento por setor, cada um com um array de itens
  let first=true;
  try{
    catalogoCol.onSnapshot(snap=>{
      if(state.isSample){ state.itens={}; state.isSample=false; banner(""); }
      snap.docChanges().forEach(ch=>{
        const setor=ch.doc.id; const data=ch.doc.data()||{};
        // remove itens antigos deste setor e recarrega
        Object.keys(state.itens).forEach(k=>{ if(state.itens[k].setor===setor) delete state.itens[k]; });
        if(ch.type!=="removed") (data.itens||[]).forEach(it=>{ state.itens[it.id]={...it,setor:it.setor||setor}; });
      });
      if(first && snap.empty){ banner("<b>Base conectada, catálogo ainda vazio.</b> Os 471 itens estão sendo carregados. Se esta mensagem persistir por muito tempo, me avise."); }
      else banner("");
      first=false;
      renderAll();
      if(itemsArray().length) document.getElementById("subline").textContent=`${itemsArray().length} itens · ${SETORES.length} setores · unidade Sudoeste`;
    },err=>{ setConn(false,"erro base"); toast("Base: "+(err.code||"erro")); });
  }catch(e){ setConn(false,"sem base"); loadSample(); }
}
boot();
</script>
